<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width, intial-scale=1.0">
        <title>Tic Tac Toe Game</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <main>
            <header id="header">
                <div class="player player-active"
                id="xPlayerDisplay"
                onclick="choosePlayer('X')">
                X
                </div>

                <h3 id="titleHeader">Choose</h3>

                 <div class="player"
                    id="oPlayerDisplay"
                    onclick="choosePlayer('O')">
                    O
                 </div>
            </header>

            <div id="board"> <!--Number of cells, basically creating a table-->
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>

            <button id="restartBtn">
                Restart
            </button>
        </main>

        <script src="script.js"></script>

    </body>
</html>
